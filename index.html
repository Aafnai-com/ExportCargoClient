<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishman Trade and Export - Under Construction</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styles */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #073A3A; /* Deep Teal Background */
            color: #FFFFFF; /* White Text */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* Logo / Heading */
        h1 {
            font-size: 3rem;
            color: #F4B414; /* Brand Yellow */
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.5rem;
            color: #FFFFFF;
            margin-bottom: 40px;
        }

        /* CTA Button */
        .cta-button {
            background-color: #F33C2D; /* CTA Red */
            color: #FFFFFF;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .cta-button:hover {
            background-color: #F4B414; /* Brand Yellow */
            color: #073A3A; /* Deep Teal Text */
        }

        /* Card / Section */
        .card {
            background-color: #F4F4F4; /* Light Grey */
            color: #073A3A; /* Deep Teal Text */
            padding: 20px 40px;
            border-radius: 10px;
            margin-top: 30px;
            max-width: 500px;
        }

        /* Optional Accent Text */
        .accent {
            color: #2F80C7; /* Blue Shirt Accent */
        }
    </style>
</head>
<body>
    <h1>Krishman Trade & Export</h1>
    <h2>We're Coming Soon!</h2>

    <div class="card">
        <p>Our website is currently under construction. Stay tuned for updates!</p>
        <p class="accent">Exciting things are on the way.</p>
        <a href="mailto:info@krishmantradeandexport.com" class="cta-button">Contact Us</a>
    </div>
</body>
</html>
